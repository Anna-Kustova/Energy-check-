<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENERGY CHECK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one calm column of "sheets", one per series, like the printed pages.
   Colour comes from the Anna Kustova brand: forest green on a pale grey-green block, near-black headings. */
:root{
  --ground:#f0f1ec; --paper:#ffffff; --block:#e5e5df; --soft:#d9dcd3;
  --ink:#17240d; --text:#33533a; --accent:#365938; --on-accent:#ffffff;
  --rule:#b9bdb2; --dot:#a9b0a3; --warn:#8a5a14;
  --font-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0d120e; --paper:#151d16; --block:#202b22; --soft:#2a372c;
    --ink:#eef3ea; --text:#b7cbb8; --accent:#a4cfa9; --on-accent:#0d120e;
    --rule:#46564a; --dot:#5b6c5f; --warn:#e0b162; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0d120e; --paper:#151d16; --block:#202b22; --soft:#2a372c;
  --ink:#eef3ea; --text:#b7cbb8; --accent:#a4cfa9; --on-accent:#0d120e;
  --rule:#46564a; --dot:#5b6c5f; --warn:#e0b162; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--ground);color:var(--text);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin-inline:auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);border-bottom:1px solid var(--soft)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px 8px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bar-top b{font:500 .72rem var(--font-display);letter-spacing:.18em;color:var(--accent)}
.bar-top span{font-size:.8rem;font-variant-numeric:tabular-nums}
nav.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
nav.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:40px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:17px;background:transparent;color:var(--text);font:500 .76rem var(--font-display);letter-spacing:.04em;text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* intro */
.intro{padding-block:36px 24px;display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:end}
.eyebrow{font:400 .72rem var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--text);margin:0 0 6px}
h1{margin:0;font:300 clamp(2.4rem,9vw,4rem)/1.05 var(--font-display);letter-spacing:.01em;color:var(--accent)}
.logo{width:clamp(96px,22vw,140px);height:auto}
:root[data-theme="dark"] .logo{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
.intro p.how{grid-column:1/-1;margin:0;max-width:62ch;font-size:.95rem}
.storage-warn{margin:0 0 16px;padding:10px 14px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:.9rem}

/* sheet */
.sheet{background:var(--paper);border:1px solid var(--soft);border-radius:12px;padding:clamp(18px,4vw,32px);margin-bottom:24px;scroll-margin-top:112px;display:flex;flex-direction:column;gap:20px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{background:var(--block);color:var(--text);border-radius:5px;padding:6px 12px;font:500 .68rem var(--font-display);letter-spacing:.16em;text-transform:uppercase}
.ser{font:400 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.sheet h2{margin:0;font:400 clamp(1.55rem,5vw,2.15rem)/1.15 var(--font-display);color:var(--ink);text-wrap:balance}
.sub{margin:-10px 0 0;font-size:.95rem;max-width:60ch}

.block{background:var(--block);border-radius:10px;padding:16px 20px;display:grid;grid-template-columns:1fr;gap:6px 28px}
@media (min-width:640px){.block.two{grid-template-columns:1fr 1fr;align-items:start}}
.block .col{display:flex;flex-direction:column;gap:2px}
.block.steps .stp{display:flex;gap:14px;padding:5px 0}
.block.steps .stp i{font:400 .75rem var(--font-display);font-style:normal;padding-top:3px;min-width:1.4rem}
.block.legend{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.block.legend{grid-template-columns:repeat(4,1fr)}}
.block.legend span{display:flex;gap:10px;align-items:center;font-size:.95rem}
.block.legend b{font-size:1.2rem;font-weight:400;color:var(--ink);width:1.2rem;text-align:center}
.block.banner{color:var(--text)}
.note{margin:0;font-size:.92rem}

/* controls */
.cb{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.35}
.cb input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--accent);border-radius:4px;background:transparent;display:grid;place-content:center;cursor:pointer}
.cb input::before{content:"";width:11px;height:11px;transform:scale(0);transition:transform .08s;background:var(--on-accent);clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%)}
.cb input:checked{background:var(--accent)}
.cb input:checked::before{transform:scale(1)}
.cb.solo{padding:0}
.cb.solo input{margin:0;width:22px;height:22px}
.ln{display:block;width:100%;min-width:0;height:34px;border:0;border-bottom:1.5px dotted var(--dot);background:transparent;color:var(--ink);font:400 16px/1.3 var(--font-body);padding:6px 2px 3px;border-radius:0}
.ln:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.fld{display:flex;gap:10px;align-items:flex-end}
.fld>span{flex:none;font-size:.88rem;max-width:48%;line-height:1.2;padding-bottom:6px}
.one{display:flex;flex-direction:column}
.one>span{font-size:.92rem;line-height:1.3}
.row{display:flex;gap:12px;align-items:flex-end}
.row .cb{padding:0;margin-bottom:6px}
.row .mark{margin-bottom:2px}
.mark{flex:none;width:30px;height:30px;margin:0 0 2px;border:1.5px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);font:400 1.1rem/1 var(--font-body);cursor:pointer;padding:0 0 0 8px;appearance:none;-webkit-appearance:none;overflow:hidden;white-space:nowrap;text-overflow:clip}
.mark.set{background:var(--accent);color:var(--on-accent)}

.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr;gap:16px 20px}}
.lcol{display:flex;flex-direction:column;gap:2px}
.lcol h3.lh{margin:0 0 6px;font:700 1rem var(--font-body);color:var(--ink)}
.card{border:1px solid var(--rule);border-radius:12px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.accent{border:1.5px solid var(--accent)}
.chead{display:flex;align-items:center;gap:10px}
.chead h3{margin:0;font:700 1rem/1.25 var(--font-body);color:var(--ink);flex:1;min-width:0}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--block);display:grid;place-items:center;font:400 .66rem var(--font-display);color:var(--text)}
.hint{margin:0;font-size:.88rem}
.quote{margin:0;font-size:1rem;color:var(--ink)}
.checks{display:flex;gap:6px 18px;flex-wrap:wrap;padding-top:4px}
.checks .cb{padding:4px 0;font-size:.85rem}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:700px){.split{grid-template-columns:1.1fr .9fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.calh,.calr{display:grid;grid-template-columns:6.5rem 1fr;gap:12px}
.calh{font-size:.82rem;padding-top:4px}
.postp{display:flex;flex-direction:column}
.postp .fld{padding-left:32px;font-size:.85rem}

/* battery */
.sfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap;margin-top:-6px}
.wl{display:block;width:100%;min-width:0;min-height:68px;resize:none;border:0;border-bottom:1.5px solid var(--rule);background:transparent;color:var(--ink);font:400 16px/1.5 var(--font-body);padding:6px 2px;border-radius:0}
.wl::placeholder{color:var(--dot)}
.wl:focus{outline:none;border-bottom-color:var(--accent)}
.sfoot small{font-size:.8rem}
.batt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.batt .bl{font-size:.88rem}
.bcol{display:flex;flex-direction:column;gap:2px}
.cells{display:flex;gap:3px;padding:3px;border:2px solid var(--accent);border-radius:7px;position:relative;margin-right:6px}
.cells::after{content:"";position:absolute;right:-7px;top:50%;width:4px;height:10px;margin-top:-5px;background:var(--accent);border-radius:0 2px 2px 0}
.cell{flex:none;display:block;width:32px;height:32px;margin:0;border:1px solid var(--rule);border-radius:3px;background:transparent;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none}
.cell:checked{background:var(--accent);border-color:var(--accent)}
.bval{font:500 1rem var(--font-display);color:var(--accent);min-width:3.2ch;font-variant-numeric:tabular-nums}
.scale{display:flex;justify-content:space-between;font-size:.66rem;padding-right:6px}

/* end tools */
.tools{display:flex;flex-direction:column;gap:12px;padding-block:8px 48px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:11px 18px;font:500 .9rem var(--font-body);cursor:pointer;min-height:44px}
.hid{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none}
label.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;text-align:center}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ver{font-size:.7rem;opacity:.7}
.btn.fill{background:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.tools p{margin:0;font-size:.85rem;max-width:60ch}
#rbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#imp{width:100%;min-height:6rem;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:400 .85rem/1.4 var(--font-body);padding:10px}
#exp{width:100%;min-height:9rem;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:400 .85rem/1.4 var(--font-body);padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  <div class="wrap">
    <div class="bar-top"><b>ENERGY CHECK</b><span id="prog" aria-live="polite"></span></div>

  </div>
</header>
